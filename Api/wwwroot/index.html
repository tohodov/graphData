<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GraphData</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="toolbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>GraphData</span>
      </div>
      <form id="root-form" class="root-form">
        <input id="root-input" type="text" autocomplete="off" spellcheck="false" placeholder="Имя узла">
        <button type="submit">Открыть</button>
      </form>
      <div class="toolbar-actions">
        <button id="fit-button" type="button">Подогнать</button>
        <button id="reset-button" type="button">Сброс</button>
      </div>
      <output id="status" class="status" aria-live="polite"></output>
    </header>

    <section class="workspace">
      <div class="graph-surface">
        <svg id="graph" role="img" aria-label="Редактор графа GraphData">
          <g id="viewport"></g>
        </svg>
        <div id="empty-state" class="empty-state">
          <div class="empty-title">Узел не выбран</div>
        </div>
      </div>

      <aside class="side-panel">
        <nav class="tabs" aria-label="Разделы редактора">
          <button class="tab-button active" type="button" data-tab="node">Узел</button>
          <button class="tab-button" type="button" data-tab="search">Поиск</button>
          <button class="tab-button" type="button" data-tab="subgraph">Подграф</button>
        </nav>

        <section id="tab-node" class="tab-panel active">
          <div class="panel-block selected-node">
            <span class="eyebrow">Выбран</span>
            <h1 id="selected-name">-</h1>
            <div class="button-row">
              <button id="save-node-button" type="button">Сохранить</button>
              <button id="delete-node-button" class="danger-button" type="button">Удалить</button>
            </div>
          </div>

          <div class="panel-block">
            <div class="section-heading">
              <span class="eyebrow">Атрибуты</span>
              <button id="add-attribute-button" type="button">Добавить</button>
            </div>
            <div id="attribute-editor" class="attribute-editor"></div>
          </div>

          <form id="create-node-form" class="panel-block compact-form">
            <span class="eyebrow">Создать узел</span>
            <div class="inline-form">
              <input id="create-node-name" type="text" autocomplete="off" spellcheck="false" placeholder="Имя нового узла">
              <button type="submit">Создать</button>
            </div>
          </form>

          <form id="connect-form" class="panel-block compact-form">
            <span class="eyebrow">Соединить с выбранным</span>
            <div class="inline-form">
              <input id="connect-target-name" type="text" autocomplete="off" spellcheck="false" placeholder="Имя узла">
              <button type="submit">Связать</button>
            </div>
          </form>

          <div class="panel-block">
            <span class="eyebrow">Соседи</span>
            <div id="neighbor-list" class="neighbor-list"></div>
          </div>
        </section>

        <section id="tab-search" class="tab-panel">
          <form id="search-form" class="stack-form">
            <label>
              <span>Текст</span>
              <input id="search-text" type="text" autocomplete="off" spellcheck="false">
            </label>
            <label>
              <span>Потомок узла</span>
              <input id="search-descendant" type="text" autocomplete="off" spellcheck="false">
            </label>
            <div class="two-cols">
              <label>
                <span>Глубина</span>
                <input id="search-descendant-depth" type="number" min="0" value="8">
              </label>
              <label>
                <span>Лимит</span>
                <input id="search-limit" type="number" min="1" max="500" value="50">
              </label>
            </div>
            <label>
              <span>Связан со всеми</span>
              <input id="search-connected-all" type="text" autocomplete="off" spellcheck="false" placeholder="a, b, c">
            </label>
            <label>
              <span>Связан с любым</span>
              <input id="search-connected-any" type="text" autocomplete="off" spellcheck="false" placeholder="a, b, c">
            </label>
            <div class="two-cols">
              <label>
                <span>Глубина связей</span>
                <input id="search-connected-depth" type="number" min="0" value="2">
              </label>
              <label class="check-line">
                <input id="search-include-self" type="checkbox">
                <span>Включать себя</span>
              </label>
            </div>
            <button type="submit">Найти</button>
          </form>
          <div id="search-results" class="result-list"></div>
        </section>

        <section id="tab-subgraph" class="tab-panel">
          <form id="subgraph-form" class="stack-form">
            <label>
              <span>Корни</span>
              <input id="subgraph-roots" type="text" autocomplete="off" spellcheck="false" placeholder="a, b, c">
            </label>
            <div class="two-cols">
              <label>
                <span>Глубина</span>
                <input id="subgraph-depth" type="number" min="0" value="1">
              </label>
              <label class="check-line">
                <input id="subgraph-include-disconnected" type="checkbox">
                <span>Оставлять корни</span>
              </label>
            </div>
            <button type="submit">Загрузить</button>
          </form>
          <div id="subgraph-results" class="result-list"></div>
        </section>
      </aside>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
