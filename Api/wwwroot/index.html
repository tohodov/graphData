<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GraphData</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="toolbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>GraphData</span>
      </div>
      <form id="root-form" class="root-form">
        <input id="root-input" type="text" autocomplete="off" spellcheck="false" placeholder="GlobalId узла">
        <button type="submit">Открыть</button>
      </form>
      <div class="toolbar-actions">
        <button id="fit-button" type="button">Подогнать</button>
        <button id="reset-button" type="button">Сброс</button>
      </div>
      <output id="status" class="status" aria-live="polite"></output>
    </header>

    <section class="workspace">
      <div class="graph-surface">
        <svg id="graph" role="img" aria-label="Редактор графа GraphData">
          <g id="viewport"></g>
        </svg>
        <div id="empty-state" class="empty-state">
          <div class="empty-title">Узел не выбран</div>
        </div>
      </div>

      <aside class="side-panel">
        <nav class="tabs" aria-label="Разделы редактора">
          <button class="tab-button active" type="button" data-tab="node">Узел</button>
          <button class="tab-button" type="button" data-tab="types">Types</button>
          <button class="tab-button" type="button" data-tab="search">Поиск</button>
          <button class="tab-button" type="button" data-tab="subgraph">Подграф</button>
        </nav>

        <section id="tab-node" class="tab-panel active">
          <div class="panel-block selected-node">
            <span class="eyebrow">Выбран</span>
            <h1 id="selected-name">-</h1>
            <div class="button-row">
              <button id="save-node-button" type="button">Сохранить</button>
              <button id="delete-node-button" class="danger-button" type="button">Удалить</button>
            </div>
          </div>

          <div class="panel-block">
            <div class="section-heading">
              <span class="eyebrow">Атрибуты</span>
              <button id="add-attribute-button" type="button">Добавить</button>
            </div>
            <div id="attribute-editor" class="attribute-editor"></div>
          </div>

          <form id="create-node-form" class="panel-block compact-form">
            <span class="eyebrow">Создать узел</span>
            <div class="inline-form">
              <input id="create-node-name" type="text" autocomplete="off" spellcheck="false" placeholder="LocalId нового узла">
              <button type="submit">Создать</button>
            </div>
          </form>

          <form id="connect-form" class="panel-block compact-form">
            <span class="eyebrow">Соединить с выбранным</span>
            <div class="inline-form">
              <input id="connect-target-name" type="text" autocomplete="off" spellcheck="false" placeholder="GlobalId узла">
              <button type="submit">Связать</button>
            </div>
          </form>

          <div class="panel-block">
            <span class="eyebrow">Соседи</span>
            <div id="neighbor-list" class="neighbor-list"></div>
          </div>
        </section>

        <section id="tab-types" class="tab-panel">
          <div class="panel-block">
            <span class="eyebrow">Projection</span>
            <div class="stack-form">
              <label>
                <span>View mode</span>
                <select id="projection-mode">
                  <option value="physical">Physical</option>
                  <option value="typed">Typed</option>
                  <option value="mixed">Mixed</option>
                </select>
              </label>
              <label>
                <span>Basis GlobalId</span>
                <input id="basis-node" type="text" autocomplete="off" spellcheck="false" placeholder="graphdata/bases/default">
              </label>
              <div class="button-row">
                <button id="load-basis-button" type="button">Load basis</button>
                <button id="ensure-basis-button" type="button">Ensure default</button>
              </div>
              <label>
                <span>Node type root</span>
                <input id="node-type-root" type="text" autocomplete="off" spellcheck="false" value="graphdata/types/nodes">
              </label>
              <label>
                <span>Edge type root</span>
                <input id="edge-type-root" type="text" autocomplete="off" spellcheck="false" value="graphdata/types/edges">
              </label>
              <label>
                <span>Relation root</span>
                <input id="relation-root" type="text" autocomplete="off" spellcheck="false" value="graphdata/relations">
              </label>
              <button id="refresh-types-button" type="button">Refresh types</button>
              <button id="load-relations-button" type="button">Load relation instances</button>
              <div id="projection-summary" class="result-summary"></div>
            </div>
          </div>

          <form id="node-type-form" class="panel-block stack-form">
            <span class="eyebrow">Node type</span>
            <input id="node-type-name" type="text" autocomplete="off" spellcheck="false" placeholder="LocalId">
            <input id="node-type-label" type="text" autocomplete="off" spellcheck="false" placeholder="Label">
            <input id="node-type-color" type="text" autocomplete="off" spellcheck="false" placeholder="#0f766e">
            <button type="submit">Create / update node type</button>
          </form>
          <div id="node-type-list" class="result-list panel-block"></div>

          <form id="typed-node-form" class="panel-block stack-form">
            <span class="eyebrow">Node instance</span>
            <input id="typed-node-name" type="text" autocomplete="off" spellcheck="false" placeholder="New node LocalId">
            <select id="typed-node-type"></select>
            <button type="submit">Create typed node</button>
          </form>
          <div class="panel-block stack-form">
            <span class="eyebrow">Assign selected node type</span>
            <select id="assign-node-type"></select>
            <button id="assign-node-type-button" type="button">Assign to selected</button>
          </div>

          <form id="edge-type-form" class="panel-block stack-form">
            <span class="eyebrow">Edge type</span>
            <input id="edge-type-name" type="text" autocomplete="off" spellcheck="false" placeholder="LocalId">
            <input id="edge-type-label" type="text" autocomplete="off" spellcheck="false" placeholder="Label">
            <input id="edge-type-color" type="text" autocomplete="off" spellcheck="false" placeholder="#b45309">
            <label class="check-line">
              <input id="edge-type-directed" type="checkbox" checked>
              <span>Directed</span>
            </label>
            <button type="submit">Create / update edge type</button>
          </form>
          <div id="edge-type-list" class="result-list panel-block"></div>

          <form id="typed-connection-form" class="panel-block stack-form">
            <span class="eyebrow">Edge instance</span>
            <input id="typed-edge-source" type="text" autocomplete="off" spellcheck="false" placeholder="Source GlobalId">
            <input id="typed-edge-target" type="text" autocomplete="off" spellcheck="false" placeholder="Target GlobalId">
            <select id="typed-edge-type"></select>
            <input id="typed-edge-name" type="text" autocomplete="off" spellcheck="false" placeholder="Relation LocalId optional">
            <button type="submit">Create typed edge</button>
          </form>
          <div id="typed-edge-list" class="result-list"></div>
        </section>

        <section id="tab-search" class="tab-panel">
          <form id="search-form" class="stack-form">
            <label>
              <span>JSON запрос</span>
              <textarea id="search-query-json" rows="18" autocomplete="off" spellcheck="false"></textarea>
            </label>
            <div class="query-template-grid">
              <button type="button" data-query-template="all">Все узлы</button>
              <button type="button" data-query-template="text">Текст</button>
              <button type="button" data-query-template="connected">Связан с узлом</button>
              <button type="button" data-query-template="neighborById">Сосед с id</button>
              <button type="button" data-query-template="neighborConnected">Сосед связан с Z</button>
              <button type="button" data-query-template="isolated">Изолированные</button>
            </div>
            <div class="button-row">
              <button id="search-submit-button" type="submit">Найти решения</button>
              <button id="search-stop-button" type="button" disabled>Остановить</button>
            </div>
          </form>
          <div id="search-results" class="result-list"></div>
        </section>

        <section id="tab-subgraph" class="tab-panel">
          <form id="subgraph-form" class="stack-form">
            <label>
              <span>GlobalId корней</span>
              <input id="subgraph-roots" type="text" autocomplete="off" spellcheck="false" placeholder="a, b, c">
            </label>
            <div class="two-cols">
              <label>
                <span>Глубина</span>
                <input id="subgraph-depth" type="number" min="0" value="1">
              </label>
              <label class="check-line">
                <input id="subgraph-include-disconnected" type="checkbox">
                <span>Оставлять корни</span>
              </label>
            </div>
            <button type="submit">Загрузить</button>
          </form>
          <div id="subgraph-results" class="result-list"></div>
        </section>
      </aside>
    </section>
  </main>

  <script src="/app.js?v=20260602-types"></script>
</body>
</html>
