<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GraphData</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="toolbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>GraphData</span>
      </div>
      <form id="root-form" class="root-form">
        <input id="root-input" type="text" autocomplete="off" spellcheck="false" placeholder="GlobalId узла">
        <button type="submit">Открыть</button>
      </form>
      <div class="toolbar-actions">
        <button id="fit-button" type="button">Подогнать</button>
        <button id="reset-button" type="button">Сброс</button>
      </div>
      <output id="status" class="status" aria-live="polite"></output>
    </header>

    <section class="workspace">
      <div class="graph-surface">
        <svg id="graph" role="img" aria-label="Редактор графа GraphData">
          <g id="viewport"></g>
        </svg>
        <div id="empty-state" class="empty-state">
          <div class="empty-title">Узел не выбран</div>
        </div>
      </div>

      <aside class="side-panel">
        <nav class="tabs" aria-label="Разделы редактора">
          <button class="tab-button active" type="button" data-tab="node">Узел</button>
          <button class="tab-button" type="button" data-tab="types">Базис</button>
          <button class="tab-button" type="button" data-tab="search">Поиск</button>
          <button class="tab-button" type="button" data-tab="subgraph">Подграф</button>
        </nav>

        <section id="tab-node" class="tab-panel active">
          <div class="panel-block selected-node">
            <span class="eyebrow">Выбран</span>
            <h1 id="selected-name">-</h1>
            <div class="button-row">
              <button id="save-node-button" type="button">Сохранить</button>
              <button id="delete-node-button" class="danger-button" type="button">Удалить</button>
            </div>
          </div>

          <div class="panel-block">
            <div class="section-heading">
              <span class="eyebrow">Атрибуты</span>
              <button id="add-attribute-button" type="button">Добавить</button>
            </div>
            <div id="attribute-editor" class="attribute-editor"></div>
          </div>

          <div class="panel-block stack-form">
            <span class="eyebrow">Тип выбранного узла</span>
            <select id="assign-node-type"></select>
            <button id="assign-node-type-button" type="button">Назначить выбранному</button>
          </div>

          <form id="create-node-form" class="panel-block stack-form">
            <span class="eyebrow">Создать узел</span>
            <input id="create-node-name" type="text" autocomplete="off" spellcheck="false" placeholder="LocalId нового узла">
            <input id="create-node-parent" type="text" autocomplete="off" spellcheck="false" placeholder="Parent GlobalId, необязательно">
            <select id="create-node-type"></select>
            <button type="submit">Создать</button>
          </form>

          <form id="connect-form" class="panel-block stack-form">
            <span class="eyebrow">Соединить с выбранным</span>
            <input id="connect-target-name" type="text" autocomplete="off" spellcheck="false" placeholder="GlobalId узла">
            <select id="connect-edge-type"></select>
            <input id="connect-edge-name" type="text" autocomplete="off" spellcheck="false" placeholder="LocalId связи, если выбран тип">
            <button type="submit">Связать</button>
          </form>

          <div class="panel-block">
            <span class="eyebrow">Соседи</span>
            <div id="neighbor-list" class="neighbor-list"></div>
          </div>
        </section>

        <section id="tab-types" class="tab-panel">
          <div class="panel-block">
            <span class="eyebrow">Проекция</span>
            <div class="stack-form">
              <label>
                <span>Базис отображения</span>
                <select id="projection-basis">
                  <option value="empty">Пустой базис</option>
                  <option value="typed">Типовой базис</option>
                </select>
              </label>
              <label>
                <span>Узел базиса GlobalId</span>
                <input id="basis-node" type="text" autocomplete="off" spellcheck="false" placeholder="graphdata/bases/default">
              </label>
              <div class="button-row">
                <button id="load-basis-button" type="button">Загрузить базис</button>
                <button id="ensure-basis-button" type="button">Создать базовый</button>
              </div>
              <label>
                <span>Корень типов узлов</span>
                <input id="node-type-root" type="text" autocomplete="off" spellcheck="false" value="graphdata/types/nodes">
              </label>
              <label>
                <span>Корень типов связей</span>
                <input id="edge-type-root" type="text" autocomplete="off" spellcheck="false" value="graphdata/types/edges">
              </label>
              <label>
                <span>Корень инстансов связей</span>
                <input id="relation-root" type="text" autocomplete="off" spellcheck="false" value="graphdata/relations">
              </label>
              <button id="refresh-types-button" type="button">Загрузить подграф базиса</button>
              <button id="load-relations-button" type="button">Загрузить инстансы связей</button>
              <div id="projection-summary" class="result-summary"></div>
            </div>
          </div>

          <div class="panel-block">
            <span class="eyebrow">Правила узлов</span>
            <div id="node-type-list" class="result-list"></div>
          </div>

          <div class="panel-block">
            <span class="eyebrow">Правила связей</span>
            <div id="edge-type-list" class="result-list"></div>
          </div>

          <div id="typed-edge-list" class="result-list"></div>
        </section>

        <section id="tab-search" class="tab-panel">
          <form id="search-form" class="stack-form">
            <label>
              <span>JSON запрос</span>
              <textarea id="search-query-json" rows="18" autocomplete="off" spellcheck="false"></textarea>
            </label>
            <div class="query-template-grid">
              <button type="button" data-query-template="all">Все узлы</button>
              <button type="button" data-query-template="text">Текст</button>
              <button type="button" data-query-template="connected">Связан с узлом</button>
              <button type="button" data-query-template="neighborById">Сосед с id</button>
              <button type="button" data-query-template="neighborConnected">Сосед связан с Z</button>
              <button type="button" data-query-template="isolated">Изолированные</button>
            </div>
            <div class="button-row">
              <button id="search-submit-button" type="submit">Найти решения</button>
              <button id="search-stop-button" type="button" disabled>Остановить</button>
            </div>
          </form>
          <div id="search-results" class="result-list"></div>
        </section>

        <section id="tab-subgraph" class="tab-panel">
          <form id="subgraph-form" class="stack-form">
            <label>
              <span>GlobalId корней</span>
              <input id="subgraph-roots" type="text" autocomplete="off" spellcheck="false" placeholder="a, b, c">
            </label>
            <div class="two-cols">
              <label>
                <span>Глубина</span>
                <input id="subgraph-depth" type="number" min="0" value="1">
              </label>
              <label class="check-line">
                <input id="subgraph-include-disconnected" type="checkbox">
                <span>Оставлять корни</span>
              </label>
            </div>
            <button type="submit">Загрузить</button>
          </form>
          <div id="subgraph-results" class="result-list"></div>
        </section>
      </aside>
    </section>
  </main>

  <script src="/app.js?v=20260602-basis-rules"></script>
</body>
</html>
