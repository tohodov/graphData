<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GraphData WebGPU Raw</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>GraphData</span>
        <strong>WebGPU Raw</strong>
      </div>

      <form id="load-form" class="load-form">
        <input id="roots-input" type="text" autocomplete="off" spellcheck="false" placeholder="root/a, root/b">
        <label class="number-field">
          <span>Depth</span>
          <input id="depth-input" type="number" min="0" max="8" value="1">
        </label>
        <button id="load-button" type="submit">Load</button>
      </form>

      <nav class="client-nav" aria-label="Clients">
        <a href="/clients/VanillaJs/">Vanilla</a>
        <a href="/clients/WebGpuRaw/" aria-current="page">WebGPU</a>
        <a href="/clients/TilePyramid/">Tiles</a>
      </nav>

      <output id="status" class="status" aria-live="polite"></output>
    </header>

    <section class="workspace">
      <section class="graph-stage" aria-label="Graph viewport">
        <canvas id="graph-canvas"></canvas>
        <div id="gpu-warning" class="gpu-warning" hidden>
          <strong>WebGPU unavailable</strong>
          <span>Use a Chromium/Edge build with WebGPU enabled.</span>
        </div>
        <div class="viewport-actions">
          <button id="fit-button" type="button">Fit</button>
          <button id="reset-button" type="button">Reset</button>
        </div>
        <dl class="stats-strip">
          <div>
            <dt>Nodes</dt>
            <dd id="stat-nodes">0</dd>
          </div>
          <div>
            <dt>Edges</dt>
            <dd id="stat-edges">0</dd>
          </div>
          <div>
            <dt>Memory</dt>
            <dd id="stat-memory">0 B</dd>
          </div>
          <div>
            <dt>Frame</dt>
            <dd id="stat-frame">0 ms</dd>
          </div>
        </dl>
      </section>

      <aside class="side-panel">
        <section class="panel-section selected-section">
          <div class="section-title">
            <span>Selected</span>
            <button id="load-selected-button" type="button" disabled>Load</button>
          </div>
          <h1 id="selected-title">-</h1>
          <dl class="selected-meta">
            <div>
              <dt>GlobalId</dt>
              <dd id="selected-global">-</dd>
            </div>
            <div>
              <dt>Degree</dt>
              <dd id="selected-degree">-</dd>
            </div>
          </dl>
        </section>

        <section class="panel-section">
          <div class="section-title">
            <span>Attributes</span>
          </div>
          <div id="attribute-list" class="attribute-list"></div>
        </section>

        <section class="panel-section">
          <div class="section-title">
            <span>Pipeline</span>
          </div>
          <dl class="pipeline-list">
            <div>
              <dt>Data</dt>
              <dd id="pipeline-data">empty</dd>
            </div>
            <div>
              <dt>Layout</dt>
              <dd id="pipeline-layout">idle</dd>
            </div>
            <div>
              <dt>Renderer</dt>
              <dd id="pipeline-renderer">initializing</dd>
            </div>
          </dl>
        </section>
      </aside>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
