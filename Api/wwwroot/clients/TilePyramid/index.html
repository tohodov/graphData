<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GraphData Tile Pyramid</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>GraphData</span>
        <strong>Tile Pyramid</strong>
      </div>

      <form id="load-form" class="load-form">
        <input id="roots-input" type="text" autocomplete="off" spellcheck="false" placeholder="root/a, root/b">
        <label class="number-field">
          <span>Depth</span>
          <input id="depth-input" type="number" min="0" max="8" value="1">
        </label>
        <button id="load-button" type="submit">Load</button>
      </form>

      <nav class="client-nav" aria-label="Clients">
        <a href="/clients/VanillaJs/">Vanilla</a>
        <a href="/clients/WebGpuRaw/">WebGPU</a>
        <a href="/clients/TilePyramid/" aria-current="page">Tiles</a>
      </nav>

      <output id="status" class="status" aria-live="polite"></output>
    </header>

    <section class="workspace">
      <section class="map-stage" aria-label="Tile pyramid graph viewport">
        <canvas id="map-canvas"></canvas>
        <div class="viewport-actions">
          <button id="fit-button" type="button">Fit</button>
          <button id="reset-button" type="button">Reset</button>
        </div>
        <dl class="stats-strip">
          <div>
            <dt>Level</dt>
            <dd id="stat-level">0</dd>
          </div>
          <div>
            <dt>Tiles</dt>
            <dd id="stat-tiles">0</dd>
          </div>
          <div>
            <dt>Drawn</dt>
            <dd id="stat-drawn">0 / 0</dd>
          </div>
          <div>
            <dt>Frame</dt>
            <dd id="stat-frame">0 ms</dd>
          </div>
        </dl>
      </section>

      <aside class="side-panel">
        <section class="panel-section selected-section">
          <div class="section-title">
            <span>Selected</span>
            <button id="load-selected-button" type="button" disabled>Load</button>
          </div>
          <h1 id="selected-title">-</h1>
          <dl class="selected-meta">
            <div>
              <dt>GlobalId</dt>
              <dd id="selected-global">-</dd>
            </div>
            <div>
              <dt>Rank</dt>
              <dd id="selected-rank">-</dd>
            </div>
            <div>
              <dt>Degree</dt>
              <dd id="selected-degree">-</dd>
            </div>
          </dl>
        </section>

        <section class="panel-section">
          <div class="section-title">
            <span>Pyramid</span>
          </div>
          <dl class="pipeline-list">
            <div>
              <dt>Graph</dt>
              <dd id="pipeline-graph">empty</dd>
            </div>
            <div>
              <dt>Build</dt>
              <dd id="pipeline-build">idle</dd>
            </div>
            <div>
              <dt>Mode</dt>
              <dd id="pipeline-mode">semantic zoom</dd>
            </div>
          </dl>
        </section>

        <section class="panel-section">
          <div class="section-title">
            <span>Level Budget</span>
          </div>
          <label class="range-row">
            <span>Tile capacity</span>
            <input id="capacity-input" type="range" min="60" max="420" step="20" value="180">
            <output id="capacity-output">180</output>
          </label>
          <label class="check-row">
            <input id="tile-debug-input" type="checkbox">
            <span>Show tile grid</span>
          </label>
        </section>

        <section class="panel-section">
          <div class="section-title">
            <span>Attributes</span>
          </div>
          <div id="attribute-list" class="attribute-list"></div>
        </section>
      </aside>
    </section>
  </main>

  <script type="module" src="./app.js?v=20260609-tile-pyramid-v2"></script>
</body>
</html>
